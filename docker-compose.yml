services:
  itops:
    build: .
    image: itops-workspace:latest
    container_name: itops
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8000"
      # Nhận log & trap từ thiết bị (đổi vế trái nếu cổng máy chủ đã bị chiếm)
      - "${SYSLOG_PORT:-514}:514/udp"
      - "${SYSLOG_PORT:-514}:514/tcp"
      - "${TRAP_PORT_HOST:-162}:162/udp"
    env_file: .env
    volumes:
      - ./data:/data
    # cần cho lệnh ping (ICMP) bên trong container
    cap_add:
      - NET_RAW
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
